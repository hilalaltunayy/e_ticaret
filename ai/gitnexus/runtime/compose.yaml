name: gitnexus-runtime

services:
  gitnexus:
    image: node:20-bookworm
    container_name: gitnexus
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: C:\code\e_ticaret
        target: /workspace
      - type: volume
        source: gitnexus_index_data
        target: /workspace/.gitnexus
    restart: unless-stopped

volumes:
  gitnexus_index_data:
    name: gitnexus_index_data
